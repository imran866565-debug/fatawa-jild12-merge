name: Merge Jild 12 tashreeh
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Merge chunks
        run: python3 merge_jild12.py
      - name: Verify merged file
        run: |
          python3 - <<'EOF'
          import json
          d = json.load(open('jild-12.json', encoding='utf-8'))
          items = d['masail']
          pages = set()
          for it in items:
              pages.update(it['pages'])
          print('items:', len(items))
          print('unique pages:', len(pages), 'min:', min(pages), 'max:', max(pages))
          print('ids unique:', len(set(it['id'] for it in items)) == len(items))
          print('empty jawab:', sum(1 for it in items if not it.get('tashreeh_jawab')))
          print('with sawal:', sum(1 for it in items if it.get('tashreeh_sawal')))
          print('volume_ids:', sorted(set(it.get('volume_id') for it in items)))
          print('start_page==min(pages) all:', all(it.get('start_page') == min(it['pages']) for it in items))
          combined_ids = ['jild12-masala-20', 'jild12-masala-137', 'jild12-masala-240-241',
                          'jild12-masala-271', 'jild12-masala-289', 'jild12-masala-303']
          for cid in combined_ids:
              hits = [it for it in items if it['id'] == cid]
              print(cid, 'items:', len(hits), 'pages:', hits[0]['pages'] if hits else None)
              assert len(hits) == 1
          # masala-289 special: both halves' sawal concatenated
          m289 = [it for it in items if it['id'] == 'jild12-masala-289'][0]
          print('masala-289 sawal chars:', len(m289.get('tashreeh_sawal', '')), 'jawab chars:', len(m289.get('tashreeh_jawab', '')))
          assert len(m289.get('tashreeh_sawal', '')) > 1500
          # distinct items kept separate
          for did in ['jild12-masala-274', 'jild12-p581', 'jild12-masala-101-102']:
              assert any(it['id'] == did for it in items), f'missing distinct item {did}'
              print(did, 'present')
          assert len(items) == 338
          assert len(pages) == 588
          assert min(pages) == 5 and max(pages) == 688
          assert len(set(it['id'] for it in items)) == len(items)
          assert all(it.get('tashreeh_jawab') for it in items)
          print('VERIFICATION PASSED')
          EOF
      - name: Create release with merged file
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -la jild-12.json
          gh release create v1.0 jild-12.json --title "Jild 12 tashreeh - merged" --notes "Merged tashreeh for Fatawa Razviya Jild 12: 338 items, 588 pages (volume_id 55). Generated by merge_jild12.py from the 13 chunk files; 6 same-id split masail combined (masala-289 special rule: BOTH halves' sawal concatenated, unlike Jild 11 masala-16)." || gh release upload v1.0 jild-12.json --clobber
